services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_ENV: development
      APP_DEBUG: "true"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
